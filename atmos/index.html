<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Atmos — Temperature &amp; Humidity Monitoring</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- React + Babel via CDN (no build step) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Plain JS data + helpers (load first) -->
  <script src="src/data.js"></script>

  <!-- JSX (compiled in-browser by Babel) -->
  <script type="text/babel" src="src/ios-frame.jsx"></script>
  <script type="text/babel" src="src/screens.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
